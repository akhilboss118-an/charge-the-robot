<script>
const $=id=>document.getElementById(id),S=$('s'),L=$('logo'),T=$('t'),U=$('u');
const TXT="Developed by AkhilBoss",TOTAL=8000;
const c=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),seg=(t,a,b)=>c((t-a)/(b-a)),ease=x=>1-Math.pow(1-x,3);
function play(){
  const t0=performance.now();
  (function f(now){
    const t=now-t0;
    L.style.opacity=ease(seg(t,0,1500));            // logo fade in 0-1.5s
    const p=ease(seg(t,1200,4000));                 // title fade+zoom 1.2-4s
    T.style.opacity=p;T.style.transform=`scale(${.8+.2*p})`;
    U.textContent=TXT.slice(0,Math.floor(seg(t,3800,6000)*TXT.length)); // typewriter 3.8-6s
    S.style.opacity=1-ease(seg(t,6500,8000));       // everything fades out 6.5-8s
    if(t<TOTAL)requestAnimationFrame(f);
  })(t0);
}
$('r').onclick=play;play();
</script></body></html>
